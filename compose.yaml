# Base de datos SOLO para desarrollo. No usar estas credenciales en producción.
name: uptime

services:
  postgres:
    image: postgres:18-alpine
    container_name: uptime-postgres
    # No se reinicia sola (ni al arrancar Docker): hay que levantarla a mano con `docker compose up -d`
    restart: "no"
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime_dev
      POSTGRES_DB: uptime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
